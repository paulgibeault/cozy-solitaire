<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2d5a3d">
  <meta name="description" content="Cozy Klondike Solitaire - A warm, grandma-friendly card game">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="shortcut icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <title>Cozy Solitaire</title>
  <script src="/arcade-sdk.js"></script>
  <script>
    Arcade.init({ gameId: 'cozy-solitaire' });

    // One-shot migration of pre-Arcade keys into the namespaced layout.
    Arcade.state.migrate('v1', function () {
      function takeRaw(key) {
        var raw;
        try { raw = localStorage.getItem(key); } catch (e) { return null; }
        if (raw === null) return null;
        try { localStorage.removeItem(key); } catch (e) {}
        return raw;
      }
      function takeJSON(key) {
        var raw = takeRaw(key);
        if (raw === null) return null;
        try { return JSON.parse(raw); } catch (e) { return null; }
      }
      var stats = takeJSON('cozy-solitaire-stats');
      if (stats) Arcade.state.set('stats', stats);
      var saved = takeJSON('cozy-solitaire-state');
      if (saved) Arcade.state.set('currentGame', saved);
      var mode = takeJSON('cozy-solitaire-mode');
      if (mode) Arcade.state.set('settings', mode);
    });

    // Split the single nested `stats` blob ({ [gameTypeKey]: {...}, ... })
    // into per-category Arcade.stats entries (arcade.v1.cozy-solitaire.stats.<key>).
    Arcade.state.migrate('v2-stats-split', function () {
      var old = Arcade.state.get('stats');
      if (!old || typeof old !== 'object') return;
      Object.keys(old).forEach(function (k) {
        var v = old[k];
        if (v && typeof v === 'object') Arcade.stats.update(k, function () { return v; });
      });
      Arcade.state.remove('stats');
    });

    // Move elapsed off the currentGame blob into Arcade.session's persistKey.
    Arcade.state.migrate('v3-elapsed-to-session', function () {
      var saved = Arcade.state.get('currentGame');
      if (saved && typeof saved.elapsed === 'number') {
        Arcade.state.set('sessionElapsed', saved.elapsed);
        delete saved.elapsed;
        Arcade.state.set('currentGame', saved);
      }
    });
  </script>
</head>
<body>
  <!-- UI Layer on top of canvas -->
  <div id="ui-layer">
    <!-- Header -->
    <header id="header-bar">
      <div id="app-title-container">
        <h1 id="app-title">
          <img src="logo.svg" alt="Logo" class="title-icon">
          <span class="title-text">Cozy Solitaire</span>
          <span class="dropdown-caret">▼</span>
        </h1>
      </div>
      <div id="header-stats" style="display: flex; align-items: center; gap: 12px;">
        <button id="btn-help" style="background: none; border: none; cursor: pointer; font-size: 1rem; opacity: 0.8; transition: opacity 0.2s; pointer-events: auto;" title="How to Play" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">💡</button>
        <div>
          ♣ <span id="time-display">0:00</span>  ·  <span id="moves-display">0</span> moves
        </div>
      </div>
    </header>

    <!-- Dropdown Menu -->
    <div id="logo-dropdown" class="edgy-dropdown hidden">
      <div class="dropdown-section">
        <div class="dropdown-options">
          <button id="btn-restart" class="dropdown-btn">
            <span class="icon">↩</span> Restart Game
          </button>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-section">
        <h4 class="dropdown-header">OPTIONS</h4>
        <div class="dropdown-options">
          <button id="btn-mode" class="dropdown-btn">
            <span class="icon">▶</span> New Game
          </button>
          <button id="btn-stats" class="dropdown-btn">
            <span class="icon">♠</span> Statistics
          </button>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-section">
        <h4 class="dropdown-header">SETTINGS</h4>
        <div class="dropdown-options">
          <button id="btn-toggle-collapse" class="dropdown-btn">
            <span class="icon" id="icon-collapse">✓</span> Collapse Runs
          </button>
          <button id="btn-toggle-hints" class="dropdown-btn">
            <span class="icon" id="icon-hints">✓</span> Hint Indicators
          </button>
        </div>
      </div>
    </div>
    </div>

    <div id="undo-wrapper">
      <div id="undo-menu" class="undo-dropdown hidden">
        <div class="dropdown-section">
          <h4 class="dropdown-header">HISTORY</h4>
          <div id="undo-list" class="dropdown-options">
            <!-- Items injected by JS -->
          </div>
        </div>
      </div>
      <button id="btn-undo-floating" class="floating-btn">
        <span class="icon">↶</span>
      </button>
    </div>
    
    <!-- Seed Display -->
    <div id="seed-display" class="seed-label hidden">
      Seed: <span id="seed-value"></span>
    </div>
    
    <input type="number" id="seed-input" class="hidden mode-seed-input" min="1" max="999999" placeholder="Random">
    
    <!-- Help Modal -->
    <div id="help-modal" class="hidden">
      <h2 id="help-title">How to Play</h2>
      <div id="help-content">
         <!-- Injected by JS -->
      </div>
      <button id="btn-close-help">Close Help</button>
    </div>
  </div>

  <canvas id="game"></canvas>
  <script type="module" src="js/main.js?v=4"></script>
</body>
</html>
