<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Soft gold center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e8eef5" stop-opacity="0.9"/>
      <stop offset="60%"  stop-color="#c0bdb8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c0bdb8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle center glow -->
  <circle cx="100" cy="100" r="42" fill="url(#centerGlow)"/>

  <!-- Outer dashed ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#c0bdb8" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="5 8"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#c0bdb8" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- ♠ Top — dark green -->
  <text x="100" y="52"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54" text-anchor="middle" dominant-baseline="middle"
    fill="#1a2e4a">♠</text>

  <!-- ♥ Bottom — dark red -->
  <text x="100" y="152"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54" text-anchor="middle" dominant-baseline="middle"
    fill="#c0392b">♥</text>

  <!-- ♣ Left — dark green -->
  <text x="48" y="102"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="50" text-anchor="middle" dominant-baseline="middle"
    fill="#1a2e4a">♣</text>

  <!-- ♦ Right — dark red -->
  <text x="152" y="102"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="50" text-anchor="middle" dominant-baseline="middle"
    fill="#c0392b">♦</text>

  <!-- Diagonal small diamond pips — gold -->
  <path d="M63,63 L67,57 L71,63 L67,69Z" fill="#c0bdb8" opacity="0.9"/>
  <path d="M129,63 L133,57 L137,63 L133,69Z" fill="#c0bdb8" opacity="0.9"/>
  <path d="M63,137 L67,131 L71,137 L67,143Z" fill="#c0bdb8" opacity="0.9"/>
  <path d="M129,137 L133,131 L137,137 L133,143Z" fill="#c0bdb8" opacity="0.9"/>

  <!-- Axis ornament dots -->
  <circle cx="100" cy="78"  r="2" fill="#c0bdb8" opacity="0.8"/>
  <circle cx="100" cy="122" r="2" fill="#c0bdb8" opacity="0.8"/>
  <circle cx="78"  cy="100" r="2" fill="#c0bdb8" opacity="0.8"/>
  <circle cx="122" cy="100" r="2" fill="#c0bdb8" opacity="0.8"/>

  <!-- Center medallion ring -->
  <circle cx="100" cy="100" r="22" fill="none" stroke="#c0bdb8" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- Center "CS" monogram -->
  <text x="100" y="103"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16" font-weight="bold" font-style="italic"
    text-anchor="middle" dominant-baseline="middle"
    letter-spacing="2"
    fill="#8a9eb8">CS</text>
</svg>
