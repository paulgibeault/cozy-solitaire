<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    Monochrome felt watermark — pure black so even tiny opacity is visible.
    Canvas renders this at ~6% opacity for a dropshadow-pressed-into-felt look.
  -->
  <g fill="#000000" stroke="none">

    <!-- Outer dashed ring -->
    <circle cx="100" cy="100" r="90" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="5 8"/>

    <!-- Four suits at cardinal positions -->
    <text x="100" y="52"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="54" text-anchor="middle" dominant-baseline="middle">♠</text>

    <text x="100" y="152"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="54" text-anchor="middle" dominant-baseline="middle">♥</text>

    <text x="48" y="102"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="50" text-anchor="middle" dominant-baseline="middle">♣</text>

    <text x="152" y="102"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="50" text-anchor="middle" dominant-baseline="middle">♦</text>

    <!-- Center ring -->
    <circle cx="100" cy="100" r="22" fill="none" stroke="#000000" stroke-width="1.5"/>

    <!-- Center monogram -->
    <text x="100" y="103"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="16" font-weight="bold" font-style="italic"
      text-anchor="middle" dominant-baseline="middle"
      letter-spacing="2">CS</text>

    <!-- Ornament dots on axes -->
    <circle cx="100" cy="77"  r="2"/>
    <circle cx="100" cy="123" r="2"/>
    <circle cx="77"  cy="100" r="2"/>
    <circle cx="123" cy="100" r="2"/>

    <!-- Diagonal pip diamonds -->
    <path d="M58,58 L63,51 L68,58 L63,65Z"/>
    <path d="M132,58 L137,51 L142,58 L137,65Z"/>
    <path d="M58,142 L63,135 L68,142 L63,149Z"/>
    <path d="M132,142 L137,135 L142,142 L137,149Z"/>
  </g>
</svg>
